[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "inavbench"
version = "0.1.0"
description = "Headless INAV SITL test bench on JSBSim physics"
license = { text = "GPL-3.0" }
requires-python = ">=3.9"
dependencies = ["jsbsim>=1.3"]

[tool.setuptools]
packages = ["inavbench"]

[tool.setuptools.package-data]
inavbench = ["profiles/*.cli", "models/**/*.xml"]
